<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyFlow - Study Task Manager</title>

    <meta
        name="description"
        content="StudyFlow is a simple study task manager built with HTML, CSS and JavaScript."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <h1>StudyFlow 📚</h1>
                <p>Organize your study tasks and stay productive.</p>
            </div>

            <button id="themeButton" class="theme-button">
                🌙
            </button>
        </header>

        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <span>Total</span>
                <strong id="totalTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <strong id="completedTasks">0</strong>
            </div>

            <div class="stat-card">
                <span>Remaining</span>
                <strong id="remainingTasks">0</strong>
            </div>

        </section>

        <!-- Add Task -->
        <section class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a study task..."
                maxlength="100"
            >

            <button id="addButton">
                Add Task
            </button>

        </section>

        <!-- Search -->
        <input
            type="search"
            id="searchInput"
            placeholder="🔎 Search tasks..."
        >

        <!-- Filters -->
        <nav class="filters">

            <button
                class="filter-button active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-button"
                data-filter="completed"
            >
                Completed
            </button>

            <button
                class="filter-button"
                data-filter="remaining"
            >
                Remaining
            </button>

        </nav>

        <!-- Tasks -->
        <section class="tasks-section">

            <ul id="taskList"></ul>

            <p id="emptyMessage" class="empty-message">
                No tasks yet. Add your first study task! 🎯
            </p>

        </section>

        <footer>
            <p>StudyFlow • Built with HTML, CSS & JavaScript</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
