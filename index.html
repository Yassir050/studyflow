<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>StudyFlow</h1>
        <p>Organize your study tasks.</p>

        <div class="stats">
            <span>Total: <strong id="totalTasks">0</strong></span>
            <span>Completed: <strong id="completedTasks">0</strong></span>
            <span>Remaining: <strong id="remainingTasks">0</strong></span>
       </div>
        <input type="text" placeholder="Enter a study task">

        <button>Add Task</button>

        <ul>
            <li>Learn HTML</li>
            <li>Practice Python</li>
            <li>Learn Git & GitHub</li>
        </ul>
    </div>
    <script src="script.js"></script>

</body>
</html>
